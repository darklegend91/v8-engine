<section id="utility-panel" aria-label="Quick links and web search" hidden>

  <div class="links-head"><span>SHORTCUTS</span><button id="edit-shortcuts" type="button">EDIT LINKS</button></div>
  <div id="shortcut-editor"></div>
  <footer><span id="save-status">Links are saved on this device.</span><button id="save-shortcuts" type="button">SAVE</button></footer>
</section>
<div id="wallpaper-dock" aria-label="V8 engine wallpaper controls">

    <button id="wallpaper-hold" type="button" aria-pressed="false">HOLD VIEW</button>
